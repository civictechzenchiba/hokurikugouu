name: Wayback archive

# data/supports.csv の全公式ページを Wayback Machine に保存する（変更検知時の保存の補完）。
# Wayback 側の保存に1件あたり35〜45秒かかり、依頼の間隔20秒と合わせて160件で2時間半ほど。
# 間隔を詰めると弾かれる（5秒にしたら159件中124件が失敗した）ので 20秒から下げない。
# --max-minutes と連続失敗の打ち切りで自前に止め、途中経過のコミットに必ず到達させる。
# 直近6日以内に保存済みの URL はスキップ。日曜 3:10 JST（土曜 18:10 UTC）。

on:
  # 2026-10-25 に更新を終了した（docs/archive-runbook.md）。再開するときはコメントを外す
  # schedule:
  #   - cron: "10 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save pages to Wayback Machine
        run: python scripts/archive_pages.py --wait 20 --max-minutes 170
        continue-on-error: true
      - name: Commit archive index if changed
        # 途中で止まっても、そこまでの保存結果は必ず残す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/archive-index.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Wayback 保存の結果を archive-index に記録する。"
            git pull --rebase origin main
            git push
          fi
